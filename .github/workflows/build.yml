name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Prepare files from zip
      run: |
        unzip -o lectureflow.zip -d app_project
        cd app_project
        touch .env
        echo "GEMINI_API_KEY=dummy_key_for_build" > .env
        sed -i '/signingConfig = signingConfigs.getByName("debugConfig")/d' app/build.gradle.kts
        gradle wrapper

    - name: Build APK with Gradle
      run: |
        cd app_project
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app_project/app/build/outputs/apk/debug/app-debug.apk
        
